name: Escaneo de surebets

# El scraping en produccion se movio al PC local (Programador de tareas de
# Windows + scripts/local_scan.ps1) porque Betfair y CuotasAhora devolvian 0
# datos corriendo en runners de GitHub-hosted (IP fuera de España, ver
# checklist.md seccion 7). Este workflow se deja solo como respaldo manual
# (boton "Run workflow"), sin disparo automatico, para evitar carreras de
# `git push` con el runner local.
on:
  workflow_dispatch: {}

concurrency:
  group: surebets-scan
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      BANKROLL: ${{ vars.BANKROLL || '250' }}
      MIN_MARGIN: ${{ vars.MIN_MARGIN || '0.01' }}
      DB_PATH: data/surebets.db
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - name: "Debug: IP y país del runner (diagnóstico geo-bloqueo Betfair/CuotasAhora)"
        run: curl -s https://ipinfo.io/json || echo "No se pudo consultar ipinfo.io"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Cache de navegadores de Playwright
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Instalar Chromium (Playwright)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install --with-deps chromium

      - name: Instalar solo dependencias del sistema (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium

      - name: Ejecutar ciclo de escaneo
        run: python scripts/scan_once_action.py

      - name: Guardar estado y base de datos actualizados
        run: |
          git config user.name "surebets-bot"
          git config user.email "surebets-bot@users.noreply.github.com"
          git add data/ docs/data.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: actualizar estado del escaneo [skip ci]"
            git push
          else
            echo "Sin cambios que commitear."
          fi

      - name: Avisar por Telegram si el escaneo ha fallado
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="⚠️ Falló el escaneo de surebets en GitHub Actions. Log: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
